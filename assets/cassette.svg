<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="capframe">
      <rect x="0" y="0" width="900" height="360" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#capframe)">
    <rect width="900" height="360" fill="#0d1117"/>

    <!-- cassette body -->
    <rect x="30" y="20" width="840" height="320" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>

    <!-- screws -->
    <circle cx="55" cy="45" r="5" fill="#30363d"/>
    <circle cx="845" cy="45" r="5" fill="#30363d"/>
    <circle cx="55" cy="335" r="5" fill="#30363d"/>
    <circle cx="845" cy="335" r="5" fill="#30363d"/>

    <!-- label plate -->
    <rect x="70" y="45" width="760" height="46" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="74" font-family="SFMono-Regular, Consolas, monospace" font-size="16" fill="#f0883e" letter-spacing="1">SIDE A — OFF DUTY</text>
    <circle cx="790" cy="68" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="802" y="73" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#8b949e">PLAYING</text>

    <!-- tape ribbon -->
    <path d="M300,150 C420,190 480,190 600,150" fill="none" stroke="#30363d" stroke-width="4"/>

    <!-- reel left -->
    <g transform="translate(300,150)">
      <circle r="52" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
      <circle r="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
      <g stroke="#58a6ff" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(0)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(60)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(120)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(180)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(240)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(300)"/>
      </g>
    </g>

    <!-- reel right -->
    <g transform="translate(600,150)">
      <circle r="52" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
      <circle r="14" fill="#161b22" stroke="#f0883e" stroke-width="3"/>
      <g stroke="#f0883e" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(0)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(60)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(120)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(180)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(240)"/>
        <line x1="0" y1="-8" x2="0" y2="8" transform="rotate(300)"/>
      </g>
    </g>

    <!-- track list -->
    <g font-family="SFMono-Regular, Consolas, monospace" font-size="14" fill="#c9d1d9">
      <text x="90" y="245">01. Mechanical keyboards — building, modding, way too many switches</text>
      <text x="90" y="270">02. Showing up to local tech meetups, just to hear how others think</text>
      <text x="90" y="295">03. One chapter of a biography or philosophy book, every night</text>
      <text x="90" y="320">04. Chasing the "why" behind a bug, long after it's already fixed</text>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="358" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
