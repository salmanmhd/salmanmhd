<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="220" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="220" fill="#0d1117"/>
    <rect width="900" height="34" fill="#161b22"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="17" r="6" fill="#27c93f"/>
    <text x="450" y="22" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#8b949e">salman@dev: ~/status — zsh</text>

    <text x="30" y="80" font-family="SFMono-Regular, Consolas, monospace" font-size="17" fill="#27c93f">salman@dev</text>
    <text x="140" y="80" font-family="SFMono-Regular, Consolas, monospace" font-size="17" fill="#8b949e">:~$ status --watch</text>

    <text x="30" y="122" font-family="SFMono-Regular, Consolas, monospace" font-size="19" fill="#c9d1d9" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.36;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      &gt; full-stack engineer · systems tinkerer
    </text>

    <text x="30" y="122" font-family="SFMono-Regular, Consolas, monospace" font-size="19" fill="#c9d1d9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.39;0.63;0.69;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      &gt; mechanical keyboards &amp; late-night reading
    </text>

    <text x="30" y="122" font-family="SFMono-Regular, Consolas, monospace" font-size="19" fill="#c9d1d9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.69;0.72;0.97;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      &gt; currently deep in system design rabbit holes
    </text>

    <rect x="700" y="106" width="10" height="20" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <text x="30" y="165" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#484f58">// scroll down — this profile has a subway map, not a badge wall</text>

    <rect x="0" y="-60" width="900" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="220" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="898" height="218" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
